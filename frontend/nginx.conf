# Sirve el frontend compilado y redirige /api al backend (mismo origen: no hace falta CORS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de Angular (/vehiculos, /alertas...): si no es un archivo, entrega index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
