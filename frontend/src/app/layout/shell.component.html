<mat-sidenav-container class="shell">
  <mat-sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="menuOpen()" (closedStart)="menuOpen.set(false)" class="sidenav">
    <div class="brand">
      <mat-icon>fire_truck</mat-icon>
      <div>
        <strong>SIGMVE</strong>
        <small>Vehículos de emergencia</small>
      </div>
    </div>
    <mat-nav-list>
      @for (item of visibleNav(); track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.text }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="menuOpen.set(!menuOpen())" aria-label="Menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="spacer"></span>

      <button mat-icon-button routerLink="/alertas" matTooltip="Alertas sin reconocer" aria-label="Alertas">
        <mat-icon aria-hidden="false" [matBadge]="unacknowledged()" [matBadgeHidden]="unacknowledged() === 0" matBadgeColor="warn">notifications</mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ auth.user()?.fullName }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-header">
          <strong>{{ auth.user()?.email }}</strong>
          <small>{{ auth.role() | label }}</small>
        </div>
        <button mat-menu-item routerLink="/cuenta"><mat-icon>key</mat-icon>Cambiar contraseña</button>
        <button mat-menu-item (click)="auth.logout()"><mat-icon>logout</mat-icon>Cerrar sesión</button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
